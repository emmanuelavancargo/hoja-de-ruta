<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Convierte la hoja de ruta de entregas en un pedido de deposito en PDF, y vuelve de ese PDF al Excel original.">
<meta name="theme-color" content="#101B2B">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Hoja de Ruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* Committed to one visual world: a navy cockpit, in the brand's own blue.
     Single theme on purpose — every colour is painted explicitly below. */
  :root {
    color-scheme: dark;
    --ground:    #101B2B;
    --surface:   #18263C;
    --surface-2: #1F3150;
    --line:      #2B4066;
    --line-soft: #223351;
    --ink:       #EAF0F8;
    --ink-soft:  #A7B9D2;
    --ink-faint: #7189A9;
    --accent:    #FF7C1F;
    --accent-dim:#38220F;
    --good:      #3FD69B;
    --good-dim:  #123127;
    --danger:    #FF6B7A;
    --shadow:    0 1px 2px rgba(0,0,0,.35), 0 8px 28px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 56px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---- masthead ---- */
  .masthead { display: flex; flex-direction: column; gap: 8px; }
  .mast-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding-bottom: 16px; border-bottom: 1px solid var(--line-soft);
  }
  .masthead h1 {
    font-family: 'Archivo', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(27px, 5vw, 36px);
    letter-spacing: -.025em;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }
  .masthead p { margin: 0; color: var(--ink-soft); max-width: 62ch; }

  /* co-brand lockup: goods owner, then carrier */
  .brands { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .brands img { display: block; height: auto; opacity: .94; }
  .brands img.gdm { height: 40px; width: auto; }
  .brands img.avc { width: 130px; }
  .brands .rule { width: 1px; height: 30px; background: var(--line); }

  @media (max-width: 560px) {
    .brands img.gdm { height: 32px; }
    .brands img.avc { width: 104px; }
    .mast-row { gap: 14px; }
  }

  /* ---- dropzone ---- */
  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: var(--surface);
    padding: 26px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-visible { border-color: var(--accent); background: var(--surface-2); }
  .drop.over { border-color: var(--accent); background: var(--accent-dim); }
  .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop strong {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 16px;
    display: block; color: var(--ink);
  }
  .drop span { color: var(--ink-faint); font-size: 13.5px; display: block; margin-top: 3px; }
  .drop-formats {
    display: inline-flex; gap: 6px; margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
  }
  .drop-formats i {
    font-style: normal; padding: 3px 8px; border-radius: 3px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-soft);
  }

  /* ---- summary strip ---- */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .summary div { padding: 13px 16px; border-right: 1px solid var(--line-soft); }
  .summary div:last-child { border-right: none; }
  .summary dt {
    font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0 0 3px;
  }
  .summary dd {
    margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 500;
    font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .summary dd.big { font-size: 21px; font-weight: 600; color: var(--accent); }

  /* ---- stops ---- */
  .stop {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .stop-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line-soft);
    flex-wrap: wrap;
  }
  /* echoes the numbered badge on each stop in the printed PDF */
  .stop-n {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    background: var(--accent); color: #12203A;
    width: 26px; height: 26px; border-radius: 5px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .stop-id { flex: 1 1 240px; min-width: 0; }
  .stop-id b { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; display: block; color: var(--ink); }
  .stop-id span { color: var(--ink-soft); font-size: 13px; display: block; overflow-wrap: anywhere; }
  .stop-qty {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px;
    font-variant-numeric: tabular-nums; color: var(--good);
    background: var(--good-dim); padding: 3px 10px; border-radius: 4px;
    align-self: center; white-space: nowrap;
  }
  .tscroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th {
    text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 8px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.code { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; white-space: nowrap; color: var(--ink-soft); }
  td.num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; white-space: nowrap; }
  td.mat { min-width: 210px; }

  /* ---- actions ---- */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  /* dark text on the orange: white would only reach ~2.9:1 */
  button.act {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 14.5px;
    padding: 12px 20px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; transition: filter .15s, background .15s, border-color .15s;
    color: #111D2E; background: var(--accent);
  }
  button.act.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  button.act:hover:not(:disabled) { filter: brightness(1.08); }
  button.act.ghost:hover:not(:disabled) { background: var(--surface-2); filter: none; border-color: var(--ink-faint); }
  button.act.danger { color: var(--ink-soft); margin-left: auto; }
  button.act.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); background: var(--surface); }
  button.act:disabled { opacity: .5; cursor: not-allowed; }
  button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .linkish {
    background: none; border: none; padding: 0; font: inherit; cursor: pointer;
    color: var(--accent); text-decoration: underline; text-underline-offset: 2px;
  }
  .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .note {
    font-size: 13px; color: var(--ink-soft);
    padding: 11px 14px; border-radius: 7px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
  }
  .note.err { border-left-color: var(--danger); color: var(--danger); }
  .note.ok  { border-left-color: var(--good); color: var(--good); }

  h2.sec {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
    margin: 4px 0 -6px;
  }

  /* ---- format rejection ---- */
  .fmt {
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line));
    border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  }
  .fmt-head {
    display: flex; gap: 13px; align-items: flex-start;
    padding: 16px 18px;
    background: color-mix(in srgb, var(--danger) 11%, var(--surface));
    border-bottom: 1px solid color-mix(in srgb, var(--danger) 28%, var(--line));
  }
  .fmt-mark {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--danger); color: #1A0A0D;
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px;
    display: grid; place-items: center;
  }
  .fmt-head b {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 16px;
    color: var(--danger); display: block;
  }
  .fmt-why { margin: 9px 0 0; padding-left: 18px; color: var(--ink); font-size: 14px; }
  .fmt-why li { margin-bottom: 4px; }
  .fmt-why li::marker { color: var(--danger); }

  .fmt-body { padding: 16px 18px; }
  .fmt-body h3 {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 11.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
    margin: 0 0 4px;
  }
  .fmt-body p { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-soft); }
  .fmt-body p:last-child { margin-bottom: 0; margin-top: 12px; }
  .fmt-table { font-size: 13px; }
  .fmt-table td.req {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--accent); white-space: nowrap;
  }
  .fmt-table td.opt {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--ink-faint); white-space: nowrap;
  }
  .fmt-table td.eg { color: var(--ink-faint); font-size: 12.5px; }
  .fmt-table td.nm { color: var(--ink); white-space: nowrap; }
  .fmt-table td.ty { color: var(--ink-soft); white-space: nowrap; font-size: 12.5px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

  /* ── helpers ─────────────────────────────────────────────────────── */
  var $ = function (id) { return document.getElementById(id); };
  var txt = function (v) { return v == null ? '' : String(v).trim(); };
  var num = function (v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
  var fmt = function (n) { return new Intl.NumberFormat('es-AR').format(n); };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* group rows into delivery stops, preserving first-seen order */
  function groupStops(doc) {
    var order = [], byKey = {};
    doc.rows.forEach(function (r) {
      var key = txt(r.solicitante) + '|' + txt(r.poblacion);
      if (!byKey[key]) {
        byKey[key] = { nombre:r.nombre, solicitante:r.solicitante, poblacion:r.poblacion,
                       provincia:r.provincia, direccion:r.direccion, items:[], total:0 };
        order.push(key);
      }
      byKey[key].items.push(r);
      byKey[key].total += num(r.cantidad);
    });
    return order.map(function (k) {
      var s = byKey[k];
      var c = (doc.contactos || []).filter(function (x) { return txt(x.nombre) === txt(s.nombre); })[0];
      s.contacto = c ? c.contacto : '';
      s.telefono = c ? c.telefono : '';
      return s;
    });
  }

  function totalOf(doc) {
    return doc.rows.reduce(function (a, r) { return a + num(r.cantidad); }, 0);
  }

  /* ── read Excel ──────────────────────────────────────────────────────
     Strict on purpose: columns are matched by NAME, never by position,
     so a foreign sheet is rejected instead of silently mapped onto the
     schema. Every rejection names what is wrong.                       */
  function readXlsx(buf) {
    var wb, ws, grid;
    try {
      wb = XLSX.read(buf, { type: 'array' });
      ws = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: '' });
    } catch (e) {
      throw new FormatError(['No pude abrir el archivo. ¿Es un .xlsx válido?']);
    }
    if (!ws || !grid.length) throw new FormatError(['La primera hoja del archivo está vacía.']);

    var wanted = {};
    SCHEMA.forEach(function (s) { wanted[normHeader(s.col)] = s; });

    /* the header row is whichever of the first rows matches the most
       known column names — tolerates a logo band or title block above */
    var hdr = -1, best = 0, i;
    for (i = 0; i < grid.length && i < 30; i++) {
      var hits = 0, seen = {};
      (grid[i] || []).forEach(function (cell) {
        var n = normHeader(cell);
        if (n && wanted[n] && !seen[n]) { seen[n] = 1; hits++; }
      });
      if (hits > best) { best = hits; hdr = i; }
    }
    if (hdr === -1 || best < 4) {
      throw new FormatError([
        'No encontré la fila de encabezados de la hoja de ruta en las primeras 30 filas de la primera hoja.'
      ]);
    }

    /* column name -> index */
    var at = {}, dupes = [];
    (grid[hdr] || []).forEach(function (cell, ci) {
      var n = normHeader(cell);
      if (!wanted[n]) return;
      if (at[n] !== undefined) dupes.push(wanted[n].col); else at[n] = ci;
    });

    var faltan = SCHEMA.filter(function (s) { return at[normHeader(s.col)] === undefined; });
    if (faltan.length || dupes.length) {
      var p = [];
      if (faltan.length) {
        p.push((faltan.length === 1 ? 'Falta la columna ' : 'Faltan ' + faltan.length + ' columnas: ') +
               faltan.map(function (s) { return '«' + s.col + '»'; }).join(', ') + '.');
      }
      if (dupes.length) {
        p.push('Hay columnas repetidas: ' +
               dupes.map(function (c) { return '«' + c + '»'; }).join(', ') + '.');
      }
      throw new FormatError(p);
    }

    var idx = {};
    SCHEMA.forEach(function (s) { idx[s.key] = at[normHeader(s.col)]; });
    var getCell = function (row, key) { return txt((row || [])[idx[key]]); };

    /* data runs from under the header until N° Transporte goes blank */
    var rows = [], malCant = [], vacios = {}, end;
    for (end = hdr + 1; end < grid.length; end++) {
      if (!getCell(grid[end], 'transporte')) break;

      var r = {}, excelRow = end + 1;
      KEYS.forEach(function (k) { r[k] = getCell(grid[end], k); });

      var raw = r.cantidad;
      if (raw === '' || !isFinite(parseFloat(String(raw).replace(',', '.')))) {
        if (malCant.length < 6) malCant.push(excelRow + ' ("' + (raw || 'vacío') + '")');
      }
      r.cantidad = num(raw);

      SCHEMA.forEach(function (s) {
        if (s.req && s.key !== 'cantidad' && !r[s.key]) {
          (vacios[s.col] = vacios[s.col] || []).push(excelRow);
        }
      });
      rows.push(r);
    }

    if (!rows.length) {
      throw new FormatError([
        'Encontré los encabezados en la fila ' + (hdr + 1) +
        ', pero no hay ninguna fila de entrega debajo con «N° Transporte» cargado.'
      ]);
    }

    var probs = [];
    if (malCant.length) {
      probs.push('«Cantidad entrega» tiene que ser un número. No lo es en ' +
        (malCant.length === 1 ? 'la fila ' : 'las filas ') + malCant.join(', ') + '.');
    }
    Object.keys(vacios).forEach(function (colName) {
      var f = vacios[colName];
      probs.push('«' + colName + '» no puede ir vacía. Está vacía en ' +
        (f.length === 1 ? 'la fila ' : 'las filas ') +
        f.slice(0, 6).join(', ') + (f.length > 6 ? ' y ' + (f.length - 6) + ' más' : '') + '.');
    });
    if (probs.length) throw new FormatError(probs);

    /* contacts table: the row carrying a "Contacto" header, then its rows */
    var contactos = [], ch = -1, j;
    for (j = end; j < grid.length; j++) {
      if ((grid[j] || []).some(function (v) { return normHeader(v) === 'contacto'; })) { ch = j; break; }
    }
    if (ch > -1) {
      var base = 0;
      (grid[ch] || []).forEach(function (v, ci) { if (normHeader(v) === 'contacto') base = ci - 1; });
      if (base < 0) base = 0;
      for (j = ch + 1; j < grid.length; j++) {
        var nm = txt((grid[j] || [])[base]);
        if (!nm) continue;
        contactos.push({ nombre: nm,
          contacto: txt((grid[j] || [])[base + 1]),
          telefono: txt((grid[j] || [])[base + 2]) });
      }
    }
    return { rows: rows, contactos: contactos, origen: 'excel' };
  }

  /* ── read PDF (payload parked after %%EOF) ───────────────────────── */
  function readPdf(buf) {
    var bytes = new Uint8Array(buf), s = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    var m = s.match(/%%HDR1:([A-Za-z0-9+/=]+)/);
    if (!m) {
      throw new FormatError([
        'Este PDF no lo generó esta app, así que no trae los datos embebidos.',
        'Solo se puede volver al Excel desde un PDF descargado desde acá: al generarlo, ' +
        'la planilla de origen viaja dentro del archivo.'
      ]);
    }
    var doc;
    try { doc = JSON.parse(b64decode(m[1])); }
    catch (e) { throw new FormatError(['El PDF trae los datos embebidos pero están dañados.']); }
    if (!doc || !doc.rows || !doc.rows.length) {
      throw new FormatError(['El PDF no trae ninguna fila de entrega.']);
    }
    doc.contactos = doc.contactos || [];
    doc.origen = 'pdf';
    return doc;
  }

  /* ── write Excel ─────────────────────────────────────────────────── */
  var X_NAVY = 'FF1E3252', X_WHITE = 'FFFFFFFF', X_SOFT = 'FFF1F4F8',
      X_LINE = 'FFD3DAE3', X_GREY = 'FF6E7D94', X_ORANGE = 'FFFF6C02';
  var HDR_ROW = 6;   /* rows 1–5 carry the logo band; the reader scans for this row */

  function thin(c) { return { style: 'thin', color: { argb: c || X_LINE } }; }

  function buildXlsx(doc) {
    var wb = new ExcelJS.Workbook();
    wb.creator = 'Avancargo'; wb.created = new Date();

    var ws = wb.addWorksheet('Hoja1', {
      views: [{ state: 'frozen', ySplit: HDR_ROW }],
      pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
    });

    ws.columns = [12,11,12,32,32,42,10,11,8,20,15,16,34,10,14].map(function (w) {
      return { width: w };
    });

    /* ---- logo band ---- */
    try {
      var imgId = wb.addImage({
        base64: LOGO.gdm.replace(/^data:image\/png;base64,/, ''),
        extension: 'png'
      });
      ws.addImage(imgId, { tl: { col: 0.25, row: 0.35 }, ext: { width: 62, height: 72 } });
    } catch (e) { /* branding is nice to have, never worth failing the export */ }
    [1,2,3,4,5].forEach(function (r) { ws.getRow(r).height = 19; });

    var head = doc.rows[0] || {}, stops = groupStops(doc), total = totalOf(doc);

    function title(addr, value, opts) {
      var c = ws.getCell(addr);
      c.value = value;
      c.font = { name: 'Calibri', bold: !!opts.bold, size: opts.size || 11,
                 color: { argb: opts.color || X_NAVY } };
      return c;
    }
    title('C2', 'HOJA DE RUTA',                        { bold: true,  size: 18 });
    title('C3', 'N° Transporte  ' + (txt(head.transporte) || '—'),
                                                        { bold: true,  size: 11, color: X_ORANGE });
    title('C4', txt(head.centro) || '—',                { bold: false, size: 10, color: X_GREY });
    title('H3', stops.length + (stops.length === 1 ? ' parada' : ' paradas') +
                '   ·   ' + fmt(total) + ' bultos' +
                '   ·   ' + doc.rows.length + ' líneas',  { bold: true,  size: 10 });
    title('H4', 'Emitido ' + new Date().toLocaleString('es-AR', { day:'2-digit',
                month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
                                                        { bold: false, size: 9, color: X_GREY });

    /* ---- header row ---- */
    var hr = ws.getRow(HDR_ROW);
    hr.values = COLS.slice();
    hr.height = 26;
    hr.eachCell(function (cell) {
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: X_NAVY } };
      cell.font = { name: 'Calibri', bold: true, size: 10, color: { argb: X_WHITE } };
      cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
      cell.border = { bottom: thin(X_NAVY) };
    });

    /* ---- data rows ---- */
    var rn = HDR_ROW;
    doc.rows.forEach(function (r, i) {
      rn++;
      var row = ws.getRow(rn);
      row.values = KEYS.map(function (k) { return k === 'cantidad' ? num(r[k]) : txt(r[k]); });
      row.eachCell({ includeEmpty: true }, function (cell, col) {
        if (col > COLS.length) return;
        cell.font = { name: 'Calibri', size: 10 };
        cell.border = { bottom: thin() };
        cell.alignment = { vertical: 'middle' };
        if (i % 2) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFBFD' } };
        if (col === 8) {                                   /* Cantidad entrega */
          cell.numFmt = '#,##0';
          cell.alignment = { vertical: 'middle', horizontal: 'right' };
          cell.font = { name: 'Calibri', size: 10, bold: true };
        }
      });
    });

    /* ---- total row: a live SUM, so edits downstream recalculate ---- */
    rn++;
    var tr = ws.getRow(rn);
    tr.getCell(8).value = { formula: 'SUM(H' + (HDR_ROW + 1) + ':H' + (rn - 1) + ')',
                            result: total };
    tr.getCell(7).value = 'TOTAL';
    tr.height = 22;
    for (var c = 1; c <= COLS.length; c++) {
      var cell = tr.getCell(c);
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: X_SOFT } };
      cell.border = { top: thin(X_NAVY), bottom: thin(X_NAVY) };
      cell.font = { name: 'Calibri', bold: true, size: 11, color: { argb: X_NAVY } };
      cell.alignment = { vertical: 'middle', horizontal: c === 8 ? 'right' : (c === 7 ? 'right' : 'left') };
      if (c === 8) cell.numFmt = '#,##0';
    }

    /* ---- contacts ---- */
    if ((doc.contactos || []).length) {
      rn += 2;
      var ch = ws.getRow(rn);
      ['Nombre del solicitante', 'Contacto', 'Telefono'].forEach(function (t, i) {
        var cell = ch.getCell(4 + i);
        cell.value = t;
        cell.font = { name: 'Calibri', bold: true, size: 10, color: { argb: X_WHITE } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: X_NAVY } };
        cell.alignment = { vertical: 'middle' };
      });
      ch.height = 22;
      doc.contactos.forEach(function (ct) {
        rn++;
        var row = ws.getRow(rn);
        [txt(ct.nombre), txt(ct.contacto), txt(ct.telefono)].forEach(function (v, i) {
          var cell = row.getCell(4 + i);
          cell.value = v;
          cell.font = { name: 'Calibri', size: 10 };
          cell.border = { bottom: thin() };
        });
      });
    }

    ws.autoFilter = { from: { row: HDR_ROW, column: 1 },
                      to:   { row: HDR_ROW + doc.rows.length, column: COLS.length } };

    return wb.xlsx.writeBuffer();
  }

  /* ── write PDF ───────────────────────────────────────────────────── */
  var NAVY = [30, 50, 82], ORANGE = [255, 108, 2], GREY = [110, 125, 148],

  var GDM_H = 12.6, GDM_W = 10.88;   /* 260 × 301 */
  var AVC_W = 36,   AVC_H = 6.04;    /* 560 ×  94 */

  function buildPdf(doc) {
    var jsPDF = window.jspdf.jsPDF;
    var d = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    var W = d.internal.pageSize.getWidth(), M = 12;
    var stops = groupStops(doc), total = totalOf(doc);
    var head = doc.rows[0] || {};
    var emitido = new Date().toLocaleString('es-AR', { day:'2-digit', month:'2-digit',
      year:'numeric', hour:'2-digit', minute:'2-digit' });

    /* ---- co-brand strip: goods owner left, carrier right ---- */
    var STRIP = 17;
    d.setFillColor(255, 255, 255);
    d.rect(0, 0, W, STRIP, 'F');
    try {
      d.addImage(LOGO.gdm, 'PNG', M, 2.2, GDM_W, GDM_H);
      d.addImage(LOGO.avc, 'PNG', W - M - AVC_W, (STRIP - AVC_H) / 2, AVC_W, AVC_H);
    } catch (e) { /* a logo that fails to decode must not sink the document */ }
    d.setDrawColor(LINE[0], LINE[1], LINE[2]).setLineWidth(.25);
    d.line(0, STRIP, W, STRIP);

    /* ---- masthead band ---- */
    d.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    d.rect(0, STRIP, W, 26, 'F');
    d.setTextColor(255, 255, 255);
    d.setFont('helvetica', 'bold').setFontSize(15);
    d.text('HOJA DE RUTA', M, STRIP + 11);
    d.setFont('helvetica', 'normal').setFontSize(8.5);
    d.setTextColor(180, 195, 215);
    d.text('Pedido de preparación — depósito', M, STRIP + 16.5);

    d.setFont('helvetica', 'normal').setFontSize(7.5);
    d.setTextColor(180, 195, 215);
    d.text('N° TRANSPORTE', W - M, STRIP + 9, { align: 'right' });
    d.setFont('helvetica', 'bold').setFontSize(15);
    d.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    d.text(txt(head.transporte) || '—', W - M, STRIP + 16.5, { align: 'right' });

    /* ---- meta strip ---- */
    var y = STRIP + 26;
    d.setFillColor(SOFT[0], SOFT[1], SOFT[2]);
    d.rect(0, y, W, 13, 'F');
    d.setDrawColor(LINE[0], LINE[1], LINE[2]).setLineWidth(.2);
    d.line(0, y + 13, W, y + 13);

    var meta = [
      ['CENTRO', txt(head.centro) || '—'],
      ['PROVINCIA', txt(head.provincia) || '—'],
      ['PARADAS', String(stops.length)],
      ['BULTOS', fmt(total)],
      ['EMITIDO', emitido]
    ];
    var cw = (W - M * 2) / meta.length;
    meta.forEach(function (it, i) {
      var x = M + cw * i;
      d.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(GREY[0], GREY[1], GREY[2]);
      d.text(it[0], x, y + 5);
      d.setFont('helvetica', 'bold').setFontSize(9).setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      d.text(d.splitTextToSize(it[1], cw - 3)[0], x, y + 10);
    });
    y += 19;

    /* ---- one block per stop ---- */
    var pageH = d.internal.pageSize.getHeight();

    stops.forEach(function (s, idx) {
      var body = s.items.map(function (r) {
        return [txt(r.entrega), txt(r.pagador), txt(r.material),
                txt(r.calibre), txt(r.banda), fmt(num(r.cantidad)), ''];
      });

      /* keep the stop header with at least a few of its rows */
      if (y > pageH - 52) { d.addPage(); y = 16; }
      drawStopHeader(d, s, idx, M, W, y);

      d.autoTable({
        startY: y + 15,
        margin: { left: M, right: M, top: 16 },
        head: [['Entrega', 'Pagador', 'Material', 'Calibre', 'Banda', 'Cant.', 'OK']],
        body: body,
        foot: [['', '', '', '', 'Subtotal parada', fmt(s.total), '']],
        theme: 'grid',
        styles: { font: 'helvetica', fontSize: 7.3, cellPadding: 1.9,
                  lineColor: LINE, lineWidth: .15, textColor: [40, 52, 70], overflow: 'linebreak' },
        headStyles: { fillColor: [232, 237, 243], textColor: NAVY, fontStyle: 'bold',
                      fontSize: 6.8, cellPadding: 1.7, lineColor: LINE, lineWidth: .15 },
        footStyles: { fillColor: [252, 253, 254], textColor: NAVY, fontStyle: 'bold',
                      fontSize: 7.5, lineColor: LINE, lineWidth: .15 },
        alternateRowStyles: { fillColor: [250, 251, 253] },
        columnStyles: {
          0: { cellWidth: 19, font: 'courier', fontSize: 7 },
          1: { cellWidth: 38 },
          2: { cellWidth: 'auto' },
          3: { cellWidth: 14, font: 'courier', fontSize: 7, halign: 'center' },
          4: { cellWidth: 12, halign: 'center' },
          5: { cellWidth: 14, halign: 'right', fontStyle: 'bold' },
          6: { cellWidth: 10 }
        },
        /* empty check box in the OK column */
        didDrawCell: function (data) {
          if (data.section === 'body' && data.column.index === 6) {
            var bx = data.cell.x + data.cell.width / 2 - 1.8;
            var by = data.cell.y + data.cell.height / 2 - 1.8;
            d.setDrawColor(150, 163, 182).setLineWidth(.25);
            d.rect(bx, by, 3.6, 3.6);
          }
        }
      });

      y = d.lastAutoTable.finalY + 9;
    });

    /* ---- grand total ---- */
    if (y > pageH - 46) { d.addPage(); y = 16; }
    d.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    d.roundedRect(M, y, W - M * 2, 13, 1.2, 1.2, 'F');
    d.setFont('helvetica', 'bold').setFontSize(9).setTextColor(255, 255, 255);
    d.text('TOTAL GENERAL', M + 5, y + 8.4);
    d.setFontSize(13).setTextColor(255, 168, 92);
    d.text(fmt(total) + '  bultos', W - M - 5, y + 8.8, { align: 'right' });
    y += 23;

    /* ---- sign-off ---- */
    d.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(GREY[0], GREY[1], GREY[2]);
    var sign = ['Preparado por', 'Controlado por', 'Chofer', 'Fecha y hora'];
    var sw = (W - M * 2 - 9) / 4;
    sign.forEach(function (lbl, i) {
      var x = M + (sw + 3) * i;
      d.setDrawColor(150, 163, 182).setLineWidth(.25);
      d.line(x, y, x + sw, y);
      d.text(lbl, x, y + 4);
    });

    /* ---- page numbers ---- */
    var pages = d.internal.getNumberOfPages();
    for (var p = 1; p <= pages; p++) {
      d.setPage(p);
      d.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(GREY[0], GREY[1], GREY[2]);
      d.text(txt(head.transporte) + '  ·  ' + emitido,
             M, d.internal.pageSize.getHeight() - 6);
      d.text('Página ' + p + ' de ' + pages,
             W - M, d.internal.pageSize.getHeight() - 6, { align: 'right' });
    }

    /* ---- park the source data past %%EOF so the PDF round-trips ---- */
    var pdfBytes = new Uint8Array(d.output('arraybuffer'));
    var tail = new TextEncoder().encode('\n' + MARK +
      b64encode(JSON.stringify({ rows: doc.rows, contactos: doc.contactos || [] })) + '\n');
    var out = new Uint8Array(pdfBytes.length + tail.length);
    out.set(pdfBytes, 0);
    out.set(tail, pdfBytes.length);
    return out;
  }

  /* band occupies bandTop .. bandTop + 13; the table starts at bandTop + 15 */
  function drawStopHeader(d, s, idx, M, W, bandTop) {
    d.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    d.roundedRect(M, bandTop, W - M * 2, 13, 1.2, 1.2, 'F');

    /* stop number */
    d.setFillColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    d.roundedRect(M + 2.5, bandTop + 2.2, 8, 8.6, 1, 1, 'F');
    d.setFont('helvetica', 'bold').setFontSize(8).setTextColor(255, 255, 255);
    d.text(String(idx + 1), M + 6.5, bandTop + 8, { align: 'center' });

    /* left: who and where — clipped to leave the right block room */
    var leftX = M + 13.5, leftW = (W - M - 48) - leftX;
    d.setFont('helvetica', 'bold').setFontSize(8.6).setTextColor(255, 255, 255);
    d.text(d.splitTextToSize(txt(s.nombre), leftW)[0], leftX, bandTop + 5.6);

    var loc = [txt(s.poblacion), txt(s.provincia)].filter(Boolean).join(', ');
    var dir = txt(s.direccion);
    d.setFont('helvetica', 'normal').setFontSize(6.6).setTextColor(180, 195, 215);
    d.text(d.splitTextToSize(loc + (dir ? '  ·  ' + dir : ''), leftW)[0], leftX, bandTop + 10);

    /* right: load on top, contact underneath */
    var rightX = W - M - 3;
    d.setFont('helvetica', 'bold').setFontSize(8).setTextColor(255, 168, 92);
    d.text(fmt(s.total) + ' bultos', rightX, bandTop + 5.6, { align: 'right' });

    var contacto = [txt(s.contacto), txt(s.telefono)].filter(Boolean).join(' · ');
    if (contacto) {
      d.setFont('helvetica', 'normal').setFontSize(6.4).setTextColor(180, 195, 215);
      d.text(d.splitTextToSize(contacto, 62)[0], rightX, bandTop + 10, { align: 'right' });
    }
  }

  /* ── render ──────────────────────────────────────────────────────── */
  var current = null;

  function render(doc) {
    current = doc;
    var stops = groupStops(doc), total = totalOf(doc), head = doc.rows[0] || {};

    $('summary').innerHTML =
      cell('N° Transporte', txt(head.transporte) || '—', false) +
      cell('Centro', txt(head.centro) || '—', false) +
      cell('Paradas', String(stops.length), false) +
      cell('Bultos', fmt(total), true) +
      cell('Líneas', String(doc.rows.length), false);

    $('stopsLabel').textContent = stops.length === 1 ? '1 parada' : stops.length + ' paradas';

    $('stops').innerHTML = stops.map(function (s, i) {
      var contacto = [txt(s.contacto), txt(s.telefono)].filter(Boolean).join(' · ');
      var loc = [txt(s.poblacion), txt(s.provincia)].filter(Boolean).join(', ');
      return '<section class="stop">' +
        '<div class="stop-head">' +
          '<div class="stop-n">' + (i + 1) + '</div>' +
          '<div class="stop-id"><b>' + esc(s.nombre) + '</b>' +
            '<span>' + esc(loc) + (s.direccion ? ' · ' + esc(s.direccion) : '') + '</span>' +
            (contacto ? '<span>' + esc(contacto) + '</span>' : '') +
          '</div>' +
          '<div class="stop-qty">' + fmt(s.total) + ' bultos</div>' +
        '</div>' +
        '<div class="tscroll"><table>' +
          '<thead><tr><th>Entrega</th><th>Pagador</th><th>Material</th>' +
          '<th>Calibre</th><th>Banda</th><th style="text-align:right">Cant.</th></tr></thead>' +
          '<tbody>' + s.items.map(function (r) {
            return '<tr><td class="code">' + esc(r.entrega) + '</td>' +
              '<td>' + esc(r.pagador) + '</td>' +
              '<td class="mat">' + esc(r.material) + '</td>' +
              '<td class="code">' + esc(r.calibre) + '</td>' +
              '<td class="code">' + esc(r.banda) + '</td>' +
              '<td class="num">' + fmt(num(r.cantidad)) + '</td></tr>';
          }).join('') + '</tbody>' +
        '</table></div>' +
      '</section>';
    }).join('');

    $('loaded').hidden = false;
  }

  function cell(label, value, big) {
    return '<div><dt>' + esc(label) + '</dt><dd' + (big ? ' class="big"' : '') + '>' +
           esc(value) + '</dd></div>';
  }

  function say(text, kind, actionLabel, onAction) {
    var m = $('msg');
    m.className = 'note' + (kind ? ' ' + kind : '');
    m.textContent = text;
    if (actionLabel) {
      m.appendChild(document.createTextNode(' '));
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'linkish'; b.textContent = actionLabel;
      b.addEventListener('click', onAction);
      m.appendChild(b);
    }
    m.hidden = false;
  }
  function clearSay() { $('msg').hidden = true; }

  /* Rejection panel: what is wrong, then the format it had to be. */
  function showFormatError(problemas) {
    $('fmt').innerHTML =
      '<div class="fmt">' +
        '<div class="fmt-head">' +
          '<div class="fmt-mark">!</div>' +
          '<div style="flex:1;min-width:0">' +
            '<b>No puedo procesar este archivo</b>' +
            '<ul class="fmt-why">' +
              problemas.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') +
            '</ul>' +
          '</div>' +
        '</div>' +
        '<div class="fmt-body">' +
          '<h3>Formato esperado</h3>' +
          '<p>En la primera hoja, una fila con estos 15 encabezados y las entregas debajo. ' +
            'El orden de las columnas no importa, pero los nombres sí — y no puede faltar ninguna.</p>' +
          '<div class="tscroll"><table class="fmt-table">' +
            '<thead><tr><th>Columna</th><th>Tipo de dato</th><th></th><th>Ejemplo</th></tr></thead>' +
            '<tbody>' + SCHEMA.map(function (s) {
              return '<tr>' +
                '<td class="nm">' + esc(s.col) + '</td>' +
                '<td class="ty">' + TIPO_LABEL[s.tipo] + '</td>' +
                '<td class="' + (s.req ? 'req">obligatoria' : 'opt">opcional') + '</td>' +
                '<td class="eg">' + esc(s.ej) + '</td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table></div>' +
          '<p>Las entregas se cortan en la primera fila sin «N° Transporte». Debajo puede ir ' +
            'la fila de total y una tabla de contactos con los encabezados ' +
            '«Nombre del solicitante», «Contacto» y «Telefono».</p>' +
        '</div>' +
      '</div>';
    $('fmt').hidden = false;
  }
  function clearFormatError() { $('fmt').hidden = true; $('fmt').innerHTML = ''; }

  /* wipe the loaded route sheet so another file can be run through */
  function reset(quiet) {
    current = null;
    $('loaded').hidden = true;
    $('stops').innerHTML = '';
    $('summary').innerHTML = '';
    $('file').value = '';
    clearFormatError();
    if (quiet) { clearSay(); return; }
    say('Listo para otro archivo. Soltá el Excel o el PDF arriba, o', null,
        'cargá el ejemplo', function () {
          render(sampleDoc());
          say('Ejemplo cargado desde «Modelo hoja de ruta.xlsx».');
        });
  }

  /* ── file intake ─────────────────────────────────────────────────── */
  function handleFile(f) {
    if (!f) return;
    clearSay();
    clearFormatError();

    if (!/\.(xlsx|xls|pdf)$/i.test(f.name)) {
      reset(true);
      showFormatError(['«' + f.name + '» no es un archivo .xlsx ni .pdf.']);
      return;
    }

    var isPdf = /\.pdf$/i.test(f.name);
    var reader = new FileReader();
    reader.onload = function () {
      var doc;
      try {
        doc = isPdf ? readPdf(reader.result) : readXlsx(reader.result);
      } catch (e) {
        /* a rejected file must not leave the previous one on screen */
        reset(true);
        if (e && e.problemas) showFormatError(e.problemas);
        else say(e && e.message ? e.message : 'No pude leer el archivo.', 'err');
        return;
      }
      doc.filename = f.name.replace(/\.(xlsx|xls|pdf)$/i, '');
      render(doc);
      say('Cargué ' + doc.rows.length + ' líneas desde ' + f.name + '.', 'ok');
    };
    reader.onerror = function () { say('No pude leer el archivo.', 'err'); };
    reader.readAsArrayBuffer(f);
  }

  var drop = $('drop'), fileInput = $('file');
  drop.addEventListener('click', function () { fileInput.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', function () { handleFile(fileInput.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  /* ── downloads ───────────────────────────────────────────────────── */
  var downloads = null, downloadsReady = false;

  function baseName() {
    var head = (current && current.rows[0]) || {};
    return 'hoja-de-ruta-' + (txt(head.transporte) || 'sin-transporte');
  }

  /* plain-browser save, used when the page runs outside the Claude viewer */
  function saveLocal(filename, data) {
    var blob = (data instanceof Blob) ? data : new Blob([data]);
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return Promise.resolve();
  }

  function offer(filename, data, btn, label) {
    if (!downloadsReady) { say('Un segundo, todavía estoy preparando la descarga.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Preparando…';
    var saving = downloads ? downloads.save({ filename: filename, data: data })
                           : saveLocal(filename, data);
    saving.then(function () {
      say('Listo: ' + filename, 'ok');
    })['catch'](function (err) {
      var code = err && err.code;
      if (code === 'declined') clearSay();
      else say('No se pudo guardar el archivo' + (code ? ' (' + code + ')' : '') + '.', 'err');
    })['finally'](function () { btn.disabled = false; btn.textContent = label; });
  }

  $('toPdf').addEventListener('click', function () {
    if (!current) return;
    try {
      var bytes = buildPdf(current);
      offer(baseName() + '.pdf', bytes.buffer, this, 'Descargar PDF');
    } catch (e) { say('No pude generar el PDF: ' + e.message, 'err'); }
  });

  $('toXlsx').addEventListener('click', function () {
    if (!current) return;
    var btn = this;
    btn.disabled = true; btn.textContent = 'Generando…';
    buildXlsx(current).then(function (out) {
      btn.disabled = false; btn.textContent = 'Descargar Excel';
      offer(baseName() + '.xlsx', out, btn, 'Descargar Excel');
    })['catch'](function (e) {
      btn.disabled = false; btn.textContent = 'Descargar Excel';
      say('No pude generar el Excel: ' + (e.message || e), 'err');
    });
  });

  $('clear').addEventListener('click', function () { reset(false); });

  /* open in a working state so the tool shows what it does */
  render(sampleDoc());
  say('Ejemplo cargado desde «Modelo hoja de ruta.xlsx». Soltá tu archivo arriba para reemplazarlo.');

  /* inside the Claude viewer the host handles saves; on the web, the blob path does */
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(function (d) {
      downloads = d; downloadsReady = true;
    })['catch'](function () { downloadsReady = true; });
  } else {
    downloadsReady = true;
  }
})();
</script>
</body>
</html>
